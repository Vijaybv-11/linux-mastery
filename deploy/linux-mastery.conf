map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name linux-mastery.vm.internal;
    location / {
        proxy_pass http://127.0.0.1:5273;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Let the Abacus preview iframe render (app sends X-Frame-Options: DENY)
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai" always;
    }
}
